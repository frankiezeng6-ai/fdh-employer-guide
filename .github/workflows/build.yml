name: Rebuild Pages

on:
  push:
    branches: [main]
    paths:
      - SOURCE.md
      - tools/md2html.py
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild index.html from SOURCE.md
        run: |
          python tools/md2html.py SOURCE.md index.html --repo "$GITHUB_REPOSITORY"
          test -s index.html

      - name: Commit rebuilt index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet index.html; then
            git add index.html
            git commit -m "chore: rebuild index.html [skip ci]"
            git push origin HEAD:main
          else
            echo "index.html unchanged, nothing to commit"
          fi
